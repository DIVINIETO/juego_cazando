<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juego Cazando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cazando.css"> 
  <script src="utils.js" ></script>
</head>
<body onload="iniciarJuego();">

  <main class="juego">

    <header class="cabecera">
      <h1>Juego Cazando</h1>
      <section class="autor-ficha">
        <img class="logo" src="images.jpg" alt="Logotipo del autor">
        <div class="autor-datos">
          <h2>Sobre el autor</h2>
          <dl>
            <div><dt>Autor</dt><dd>David Nieto</dd></div>
            <div><dt>Rol</dt><dd>Desarrollador y diseñador</dd></div>
            <div><dt>Proyecto</dt><dd>Videojuego con HTML, CSS y JavaScript</dd></div>
            <div><dt>Institución</dt><dd>KRAKEDEV</dd></div>
            <div><dt>Correo</dt><dd><a href="mailto:davidnieto1125@gmail.com">davidnieto1125@gmail.com</a></dd></div>
            <div><dt>Año</dt><dd>2026</dd></div>
          </dl>
        </div>
      </section>
    </header>


    <div class="marco">
      <canvas id="areaJuego" width="500" height="500" ></canvas>
    </div>

    <p id="mensaje"></p>

    <div class="controles">
      <div class="cruceta">
        <button class="btn-dir arriba" onclick="moverArriba();" aria-label="Mover arriba">⬆</button>
        <button class="btn-dir izquierda" onclick="moverIzquierda();" aria-label="Mover a la izquierda">⬅</button>
        <button class="btn-dir abajo" onclick="moverAbajo();" aria-label="Mover abajo">⬇</button>
        <button class="btn-dir derecha" onclick="moverDerecha();" aria-label="Mover a la derecha">➡</button>
      </div>
      <div class="panel">
        <span class="dato">Puntos <span id="puntos">0</span></span>
        <span class="dato">Tiempo <span id="tiempo">10</span></span>
      </div>
      <button class="btn-reiniciar" onclick="iniciarJuego()">Reiniciar</button>
    </div>


  </main>

  <script src="cazando.js" ></script>
</body>
</html>
